name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start Redis 3.0
        run: docker run -d -p 6399:6379 redis:3

      - name: Build and verify (tests + coverage gate)
        run: mvn -B verify --file guardian/pom.xml
